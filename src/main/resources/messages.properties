recruit.archers.gold.fail=Not enough gold. The archers laugh and turn away.
recruit.archers.threat.success=They draw their bows... but your boldness earns their respect.
recruit.archers.threat.fail=They refuse your threats. You barely leave unharmed.
recruit.archers.ignore=The archers ignore you.
recruit.archers.courage.success=Your passion stirs their spirits. The archers agree to join you!
recruit.archers.courage.fail=They remain hidden in the forest, unwilling to fight.
