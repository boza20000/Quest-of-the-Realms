# Death & Victory
goblinking.boss.death=With a final cry, you drive your weapon through the Goblin King's heart!\nHis crown shatters - his reign ends in silence.\n- The Goblin Kingdom falls. The war is over.
goblinking.boss.playerdeath=The Goblin King lets out a guttural laugh as his blade pierces your chest.\nDarkness closes in... your vision fades.\nThe last thing you hear is the echo of his victory roar.
