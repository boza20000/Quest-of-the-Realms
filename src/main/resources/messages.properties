mission.village.intro1 = From the distance, you see the village on fire.\n\
Most houses are already burned.\n\
A few villagers spot you and carefully approach.\n\
You should talk to them to understand the gravity of the situation and report to the castle.

mission.village.intro2 = You spot smoke in the sky and start to worry.\n\
Was this village attacked as well?\n\
As you get closer, your heart sinks.\n\
You see a lone villager on the ground in front of a house... and approach cautiously.

# --- GOBLIN CAMP / INFILTRATION ---
mission.goblin.camp.spotted = You spot shadows moving in the distance, gathering near a camp in the forest...\n\
You found them - the creatures that caused so much destruction.\n\
Green and small, some larger, but none seem powerful enough to burn two villages...\n\
How could they have done so much harm?\n\
You move closer to investigate.

mission.goblin.overheard = You crouch behind a thicket, your breath shallow, eyes fixed on the flickering light of the goblin campfire.\n\
The guttural sounds of their speech cut through the night air...\n\n\
"South... we strike south next," one goblin snarls, slamming its fist into the dirt.\n\
"Big walls. Gold banners. The humans won't see it coming!"\n\n\
Another goblin chuckles, its teeth glinting in the firelight.\n\
"The King will be pleased. His reach grows every night..."\n\n\
A taller goblin in dark armor growls, silencing the others.\n\
"Do not speak his name so freely. The King has returned, but his eyes are everywhere now."\n\n\
- The air feels heavier... unnatural. A strange hum seems to ripple through the ground beneath you.\n\
You lean closer, trying to hear more-\n\
*Snap!*\n\
A twig breaks under your boot.\n\
Several heads turn sharply toward your hiding spot.\n\n\
"What was that?" one hisses.\n\
"Human! By the trees!" another screeches.\n\n\
Torches flare to life. The goblins snarl and grab their weapons.\n\
You've been spotted.

# --- AMBUSH DECISION / OUTCOMES ---
mission.goblin.encounter = The goblins close in, snarling and waving crude blades.\n\
You have only moments to decide what to do...

mission.goblin.choices = 1?? Try to escape.\n2?? Fight your way out.\n3?? Try to talk your way out.

mission.goblin.freeze = You freeze in fear... the goblins rush you!

mission.escape.success = You dash into the forest and lose the goblins behind you.
mission.escape.partial = You escape but take a light wound from a stray arrow.
mission.escape.fail = You are cornered by a goblin - you have no choice but to fight.

mission.fight.success = You charge forward! The goblins scatter in fear.
mission.fight.partial = You fight fiercely but are wounded before escaping.
mission.fight.fail = You are overwhelmed by the goblins!

mission.talk.success = You bluff about serving their King. Confused, they let you go.
mission.talk.partial = They hesitate, giving you time to slip away.
mission.talk.fail = They laugh mockingly and attack!

# --- KING REPORT (used by reportToKing) ---
mission.report.king.intro1 = You arrive at the Castle.\nThe guards at the gates barely recognise you - dirt-streaked, armor dented, eyes weary from the northern wilds.\nThey let you in.\n? Without hesitation, you rush through the great halls toward the King's chamber...
mission.report.king.intro2 = The air inside is tense; whispers of war already hang like a storm about to break.
mission.report.king.line1 = "My King... the rumors were true.\nThe villages... they weren't raided by men or beasts - but by *goblins*."
mission.report.king.line2 = King: "Goblins? Impossible. They were scattered long ago during the First Wars."
mission.report.king.line3 = "I saw them with my own eyes, Your Majesty.\nSmall and green - some larger and armored. But they are many. Too many.\nThey have built a camp deep in the northern forests... and they are marching south."
mission.report.king.line4 = King (leaning forward): "Marching south? Toward *us*?"
mission.report.king.line5 = "Yes, my King. Their numbers are vast - an army beyond anything we've faced in generations.\nTwo villages have already been reduced to ashes. If we do not act now...\nthe realm of men will fall before the first snow."
mission.report.king.line6 = King (grimly): "Then war it shall be."\nHe rises slowly, voice echoing through the hall.\n"Sound the horns. Summon the generals.\nThe armies of Eldoria will march north by dawn.\nWe will not wait for the shadows to reach our gates!"
mission.report.king.closure = The chamber erupts in shouts and movement - messengers rush off, the war banners are unfurled.\nYou stand before your King, weary but resolute.\n\n? King: "You have done well, brave one. Rest for now.\nSoon, all of Eldoria will owe its survival to your courage."\n\n?? The drums of war begin to thunder across the realm...


story.intro = Welcome to %sEldoria%s!\n\
For centuries, the three kingdoms of %sEldoria%s - %sHumans%s, %sOrcs%s, and %sMages%s have lived in harmony.\n\
Recently, however, strange signs have appeared in the northern lands:\n\
villages abandoned, forests unusually quiet, and rumors of creatures moving in the shadows.\n\
\n\
Your task is clear: travel north, visit the villages, explore the area,\n\
report back, and uncover the truth behind these disturbances.\n\
The kingdom trusts your skill and judgment to report back with any findings.\n\
\n\
Stay vigilant - shadows hide more than they reveal, danger could strike from anywhere.\n\
Trust no one,\n\
and remember: some threats lurk where you least expect.\n\
\n\
Press %sEnter%s to begin your adventure...

