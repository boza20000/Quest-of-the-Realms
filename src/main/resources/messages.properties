# --- ExploreManager ---
explore.arrive=You arrive at the {0}.
explore.description={0}
explore.choice.prompt=What would you like to do?
explore.choice.1=1. Enter and explore deeper.
explore.choice.2=2. Observe from outside
explore.choice.3=3. Leave before danger finds you.
explore.leave=You decide not to push your luck and quietly withdraw...
explore.enter.start=You take a deep breath and step inside...
explore.cave.beast=You descend into the darkness, your footsteps echoing softly, when suddenly glowing eyes pierce the shadows.\nA feral creature lunges at you without warning.\nYou barely manage to defend yourself before retreating in fear, wounded and shaken by the encounter.\n
explore.cave.crystal=Deep within the cave, a strange crystal hums softly, casting dancing lights along the damp stone walls.\nAs you touch it, a surge of energy pulses through your body before fading, leaving the crystal dim and lifeless ? but something useful remains behind.\n
explore.cave.empty=You wander through twisting tunnels, brushing your hand against cold stone and slick moss.\nDespite the eerie atmosphere and dripping water, nothing happens, and you eventually leave the cave with only silence as your companion.\n
explore.tower.ghost=As you climb the crumbling stairs, an icy chill grips your spine.\nThe air grows heavy as a restless spirit materializes before you.\nIts hollow eyes lock onto yours as it drifts closer, bound to this tower and eager to attack any living soul.\n
explore.tower.chest=Behind fallen debris, you discover an old wooden chest, its lock rusted with age.\nWith a firm pull, it snaps open, revealing something hidden away long ago.\n
explore.tower.empty=The tower is eerily silent.\nCobwebs sway gently as dust fills the air.\nYou search each floor carefully, but whatever secrets this place once held have long since faded into memory.\n
explore.ruins.trap=As you step deeper into the crumbling ruins, a faint click echoes beneath your boot.\nIn an instant, ancient mechanisms spring to life and arrows shoot from hidden slits in the stone walls, striking before you can fully react.\n
explore.ruins.relic=While searching through the collapsed stone and creeping moss, something catches your eye.\nBrushing away centuries of grime, you uncover an old relic, weathered by time yet still holding value.\n
explore.ruins.empty=You move carefully through the broken halls, tracing faded carvings and shattered pillars.\nThe ruins speak of a forgotten age, but today they offer nothing but silence and dust.\n
explore.sacred.attack=The moment you disturb the sacred ground, the air grows tense and hostile.\nVines burst from the earth and lash around you as unseen spirits retaliate, punishing your intrusion before releasing you.\n
explore.sacred.heal=As you pause near the sacred site, a gentle warmth spreads through the air.\nA soothing presence surrounds you, closing wounds and restoring strength, as if nature itself has chosen to aid you.\n
explore.sacred.herb=Near the ancient altar, you notice a faint, unnatural glow among the roots.\nWhen you reach for it, the plant responds with a soft pulse of energy before settling into your hands ? a rare herb infused with natural magic.\n
explore.generic.find=You sift through dust and debris, your fingers brushing against something solid.\nAfter a moment of effort, you uncover an item that might prove useful.\n
explore.generic.empty=You explore the area carefully, scanning every corner.\nDespite your efforts, nothing of interest reveals itself, and you move on.\n
explore.observe.spotted=As you watch quietly from a distance, sudden movement catches your eye.\nYou freeze just in time, avoiding detection as whatever lurks inside shifts and then settles again.\n
explore.observe.notes=You spend some time carefully observing the area.\nYou sketch details and jot down notes, hoping this knowledge will be useful in the future.\n
explore.loot=You found a {0}!
# === Recruitment: Knights ===
recruit.knights.already=The knights are already marching under your banner.
recruit.knights.enter=You enter the Southern Garrison. The Knight Commander greets you coldly.
recruit.knights.commander.greet=Commander: 'State your business, traveler.'
recruit.knights.choice.1='The realm needs you, Commander.'
recruit.knights.choice.2='You swore an oath to the King - fulfill it!'
recruit.knights.choice.3='I won't force you to fight. Farewell.'
recruit.knights.leave=You turn away. The Commander watches you go in silence.
recruit.knights.invalid=The Commander raises an eyebrow. 'Speak clearly, traveler.'
recruit.knights.persuade.start=You speak of the goblin threat and the need for unity...
recruit.knights.persuade.success=Commander: 'Your words move me, hero. The knights will stand with you!'
recruit.knights.persuade.fail=Commander: 'You speak well, but our men are weary and our coffers dry.'
recruit.knights.persuade.options=1. Offer 50 gold for supplies\n2. Try to reason again\n3. Refuse
recruit.knights.persuade.reason.success=Commander: 'Very well... You've convinced me. We'll ride at dawn.'
recruit.knights.persuade.reason.fail=Commander: 'Enough talk. Without resources, we can't fight.'
recruit.knights.persuade.refuse=You leave empty-handed. The knights remain in their barracks.
recruit.knights.intimidate.start=You step closer, voice hard. 'You swore an oath to the King. Will you break it?'
recruit.knights.intimidate.success=Commander: '...You're right. Our duty is to the realm. Knights - to arms!'
recruit.knights.intimidate.fail=Commander: 'Watch your tone, outsider. I answer to no threats.'
recruit.knights.intimidate.options=1. Apologize and change approach\n2. Double down on intimidation\n3. Leave
recruit.knights.intimidate.double.success=Your defiance surprises him. 'Hah! You've guts, at least. Fine - we'll fight!'
recruit.knights.intimidate.double.fail=The Commander orders you out. The guards glare as you leave.
recruit.knights.intimidate.leave=You walk away, tension thick in the air.
recruit.knights.pay.success=You hand over the gold. The Commander nods solemnly.\n'Supplies will arrive by dusk. You have our swords, hero.'
recruit.knights.pay.fail=You don't have enough gold. The Commander sighs: 'Then there's nothing I can do.'
# === Recruitment: Archers ===
recruit.archers.already=The archers are already prepared for battle.
recruit.archers.find=You find the archers training in the forest clearing...
recruit.archers.eager=Archer Captain: 'We've been waiting for this moment. The goblins won't know what hit them!'
recruit.archers.resource=Archer Captain: 'We could use better arrows - bring us goblin fletching, and we'll join.'
recruit.archers.resource.options=1. Promise to get the fletching\n2. Offer 30 gold instead\n3. Threaten them to obey
recruit.archers.refuse=Archer Captain: 'We've lost too many scouts. We'll not fight again.'
