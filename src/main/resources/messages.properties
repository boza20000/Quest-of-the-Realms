travel.transition.to.forest=The trees close in around you. The canopy above blocks out most of the light, and the forest grows quiet.
travel.transition.to.swamp=The ground grows damp and soft. The air becomes heavy with mist, and the smell of stagnant water fills your nose.
travel.transition.to.grass=The land opens into wide grasslands. The breeze carries the scent of wildflowers and sun-warmed earth.
travel.transition.to.village=You arrive at a village - laughter and chatter fill the air, and warm light spills from nearby windows.
travel.transition.to.castle=The walls shrink behind you as you walk further. The world ahead feels less guarded, more uncertain.
travel.transition.to.water=You hear the sound of waves and trickling streams. The ground softens, and the air carries a cool, refreshing scent.
