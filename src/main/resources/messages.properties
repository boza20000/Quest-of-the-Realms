# === Recruitment: Knights ===
recruit.knights.already = The knights are already marching under your banner.
recruit.knights.enter = You enter the Southern Garrison. The Knight Commander greets you coldly.
recruit.knights.commander.greet = Commander: 'State your business, traveler.'
recruit.knights.choice.1 = 'The realm needs you, Commander.'
recruit.knights.choice.2 = 'You swore an oath to the King - fulfill it!'
recruit.knights.choice.3 = 'I won't force you to fight. Farewell.'
recruit.knights.leave = You turn away. The Commander watches you go in silence.
recruit.knights.invalid = The Commander raises an eyebrow. 'Speak clearly, traveler.'

recruit.knights.persuade.start = You speak of the goblin threat and the need for unity...
recruit.knights.persuade.success = Commander: 'Your words move me, hero. The knights will stand with you!'
recruit.knights.persuade.fail = Commander: 'You speak well, but our men are weary and our coffers dry.'
recruit.knights.persuade.options = 1. Offer 50 gold for supplies\n2. Try to reason again\n3. Refuse
recruit.knights.persuade.reason.success = Commander: 'Very well... You've convinced me. We'll ride at dawn.'
recruit.knights.persuade.reason.fail = Commander: 'Enough talk. Without resources, we can't fight.'
recruit.knights.persuade.refuse = You leave empty-handed. The knights remain in their barracks.

recruit.knights.intimidate.start = You step closer, voice hard. 'You swore an oath to the King. Will you break it?'
recruit.knights.intimidate.success = Commander: '...You're right. Our duty is to the realm. Knights - to arms!'
recruit.knights.intimidate.fail = Commander: 'Watch your tone, outsider. I answer to no threats.'
recruit.knights.intimidate.options = 1. Apologize and change approach\n2. Double down on intimidation\n3. Leave
recruit.knights.intimidate.double.success = Your defiance surprises him. 'Hah! You've guts, at least. Fine - we'll fight!'
recruit.knights.intimidate.double.fail = The Commander orders you out. The guards glare as you leave.
recruit.knights.intimidate.leave = You walk away, tension thick in the air.

recruit.knights.pay.success = You hand over the gold. The Commander nods solemnly.\n'Supplies will arrive by dusk. You have our swords, hero.'
recruit.knights.pay.fail = You don't have enough gold. The Commander sighs: 'Then there's nothing I can do.'


